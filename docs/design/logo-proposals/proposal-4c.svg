  <path d="M104 424L256 256" fill="none" stroke="#9F50F0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" id="p4c-lower-left" data-letters="XY" data-overlap="2"/>
  <path d="M256 256L408 424" fill="none" stroke="#9F50F0" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" id="p4c-lower-right" data-letters="NX" data-overlap="2"/>
