<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="p4-title p4-desc">
  <title id="p4-title">Nyx Kit proposal 4: Merged NYX</title>
  <desc id="p4-desc">N, Y and X merged on a shared skeleton, shown as uniform primary strokes. Rounded terminals and joins soften the finished mark.</desc>
  <path d="M104 424V88 M408 88V424" fill="none" stroke="#9F50F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" id="p4-verticals" data-letters="N" data-overlap="1"/>
  <path d="M256 256L408 88" fill="none" stroke="#9F50F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" id="p4-upper-right" data-letters="XY" data-overlap="2"/>
  <path d="M104 424L256 256" fill="none" stroke="#9F50F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" id="p4-lower-left" data-letters="XY" data-overlap="2"/>
  <path d="M256 256L408 424" fill="none" stroke="#9F50F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" id="p4-lower-right" data-letters="NX" data-overlap="2"/>
  <path d="M104 88L256 256" fill="none" stroke="#9F50F0" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" id="p4-upper-left" data-letters="NYX" data-overlap="3"/>
</svg>
