  <title id="p1-title">Nyx Kit proposal 1: Shared strokes</title>
  <desc id="p1-desc">Aligned N and X with an offset Y upper-left arm; the Y right arm and stem share the continuous rising X diagonal. Rounded terminals and joins soften the finished mark.</desc>
